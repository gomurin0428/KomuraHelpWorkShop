<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>ビルド</title>
  <link rel="stylesheet" href="../styles/help.css">
</head>
<body>
  <header class="page-header">
    <p class="eyebrow">Build</p>
    <h1>ビルド</h1>
    <p class="lead">.NET SDK を使って CLI をビルドします。</p>
  </header>

  <section>
    <h2>コマンド</h2>
    <pre><code>dotnet build .\src\hhc\hhc.csproj</code></pre>
    <p>Debug ビルドでは次の実行ファイルが生成されます。</p>
    <pre><code>src\hhc\bin\Debug\net8.0\hhc.exe</code></pre>
  </section>

  <section>
    <h2>ヘルプを表示する</h2>
    <pre><code>.\src\hhc\bin\Debug\net8.0\hhc.exe --help</code></pre>
  </section>

  <section>
    <h2>終了コード</h2>
    <table>
      <thead>
        <tr><th>コード</th><th>意味</th></tr>
      </thead>
      <tbody>
        <tr><td>0</td><td>成功</td></tr>
        <tr><td>1</td><td>コンパイル失敗</td></tr>
        <tr><td>2</td><td>コマンドライン引数の誤り</td></tr>
      </tbody>
    </table>
  </section>
</body>
</html>
